<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KodaHosting - Remote Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-void: #1B1613;
            --bg-panel: #241C18;
            --koda-orange: #FF6B00;
            --border-dim: #332A24;
            --txt-primary: #FFFFFF;
            --txt-secondary: #888899;
            --btn-hover: #E55D00;
            --success: #00E676;
            --error: #FF5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-void);
            color: var(--txt-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(27, 22, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-dim);
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--txt-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--koda-orange);
        }

        .nav-links a, .nav-links button {
            color: var(--txt-secondary);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links button:hover {
            color: var(--koda-orange);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        /* Views */
        #login-view, #dashboard-view {
            display: none;
        }

        /* Login Card */
        .login-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            margin: 80px auto;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 24px;
            font-size: 2rem;
            color: var(--txt-primary);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--txt-secondary);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-void);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            color: var(--txt-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--koda-orange);
        }

        .btn {
            display: inline-block;
            background-color: var(--koda-orange);
            color: #fff;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn-google {
            background-color: #ffffff;
            color: #000000;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background-color: #f0f0f0;
        }

        .error-msg {
            color: var(--error);
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .server-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .server-title {
            font-size: 1.4rem;
            color: var(--txt-primary);
            word-break: break-all;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-online { background-color: rgba(0, 230, 118, 0.15); color: var(--success); }
        .status-offline { background-color: rgba(255, 82, 82, 0.15); color: var(--error); }
        .status-pending { background-color: rgba(255, 107, 0, 0.15); color: var(--koda-orange); }

        .server-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--txt-secondary);
            font-size: 0.95rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-dim);
            color: var(--txt-primary);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--koda-orange);
            color: var(--koda-orange);
        }

        .console-input {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .console-input input {
            flex: 1;
            padding: 10px;
            background-color: var(--bg-void);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            color: var(--txt-primary);
        }
        
        .console-input input:focus {
            outline: none;
            border-color: var(--koda-orange);
        }

        .console-input button {
            background-color: var(--border-dim);
            color: var(--txt-primary);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .console-input button:hover {
            background-color: var(--koda-orange);
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">Koda<span>Hosting</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <button id="btn-logout" style="display: none;">Logout</button>
        </div>
    </nav>

    <!-- Login View -->
    <div id="login-view" class="container">
        <div class="login-card">
            <h2>Sign In</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="input-email" placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="input-password" placeholder="••••••••">
            </div>
            <button class="btn" id="btn-login-email">Sign In with Email</button>
            <p id="login-error" class="error-msg">Invalid login credentials.</p>
            
            <div style="margin: 24px 0; color: var(--txt-secondary); position: relative; text-align: center;">
                <span style="background: var(--bg-panel); padding: 0 10px; position: relative; z-index: 1;">OR</span>
                <div style="position: absolute; top: 50%; left: 0; right: 0; border-top: 1px solid var(--border-dim); z-index: 0;"></div>
            </div>

            <button class="btn btn-google" id="btn-login-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="container">
        <div class="dashboard-header">
            <h2>Your Servers</h2>
            <button class="btn" id="btn-refresh" style="width: auto;">Refresh</button>
        </div>
        
        <div class="servers-grid" id="servers-container">
            <!-- Server cards will be injected here -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://scsezpfrrmpyuapblbxk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjc2V6cGZycm1weXVhcGJsYnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDE4MjYsImV4cCI6MjA5MjUxNzgyNn0.rHro6kQpXHAnxEaFxozYzsKY8IHIUlot-7-Q4LNbZT8';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const btnLogout = document.getElementById('btn-logout');
        const errorMsg = document.getElementById('login-error');

        let currentUser = null;
        let serversChannel = null;

        // Init
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showDashboard();
            } else {
                showLogin();
            }

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) {
                    currentUser = session.user;
                    showDashboard();
                } else {
                    currentUser = null;
                    showLogin();
                }
            });
        }

        // UI toggles
        function showLogin() {
            loginView.style.display = 'block';
            dashboardView.style.display = 'none';
            btnLogout.style.display = 'none';
            if (serversChannel) supabaseClient.removeChannel(serversChannel);
        }

        function showDashboard() {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            btnLogout.style.display = 'block';
            fetchServers();
            setupRealtime();
        }

        // Login Methods
        document.getElementById('btn-login-email').addEventListener('click', async () => {
            const email = document.getElementById('input-email').value;
            const password = document.getElementById('input-password').value;
            errorMsg.style.display = 'none';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('btn-login-google').addEventListener('click', async () => {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
            });
        });

        btnLogout.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
        });

        document.getElementById('btn-refresh').addEventListener('click', fetchServers);

        // Fetch Servers
        async function fetchServers() {
            // Check if user has an entry in koda_users
            const { data: userData } = await supabaseClient
                .from('koda_users')
                .select('app_uuid')
                .eq('auth_id', currentUser.id)
                .single();

            let uuidFilter = currentUser.id; // fallback
            if (userData && userData.app_uuid) {
                uuidFilter = userData.app_uuid;
            }

            const { data: servers, error } = await supabaseClient
                .from('koda_servers')
                .select('*')
                .eq('owner_app_uuid', uuidFilter)
                .not('host', 'like', 'deleted_%')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching servers:", error);
                return;
            }

            renderServers(servers);
        }

        // Realtime sync
        async function setupRealtime() {
            const { data: userData } = await supabaseClient
                .from('koda_users')
                .select('app_uuid')
                .eq('auth_id', currentUser.id)
                .single();
            
            let uuidFilter = currentUser.id;
            if (userData && userData.app_uuid) uuidFilter = userData.app_uuid;

            serversChannel = supabaseClient.channel('custom-all-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'koda_servers', filter: `owner_app_uuid=eq.${uuidFilter}` }, (payload) => {
                    fetchServers();
                })
                .subscribe();
        }

        function getStatusDetails(ver) {
            if (!ver || ver === 'HIBERNATED') return { label: 'Hibernated', class: 'status-offline' };
            if (ver.startsWith('CMD:')) return { label: 'Command Pending...', class: 'status-pending' };
            if (ver === 'DELETED') return { label: 'Deleted', class: 'status-offline' };
            // If it has a version like '1.21', it is either starting or online.
            // Since we can't perfectly know online vs starting from just DB without logs, we assume Online
            return { label: 'Active', class: 'status-online' };
        }

        function renderServers(servers) {
            const container = document.getElementById('servers-container');
            container.innerHTML = '';

            if (!servers || servers.length === 0) {
                container.innerHTML = '<p style="color: var(--txt-secondary);">No active servers found on your device.</p>';
                return;
            }

            servers.forEach(srv => {
                const status = getStatusDetails(srv.server_version);
                
                const card = document.createElement('div');
                card.className = 'server-card';
                card.innerHTML = `
                    <div class="server-header">
                        <div class="server-title">${srv.host}</div>
                        <div class="status-badge ${status.class}">${status.label}</div>
                    </div>
                    <div class="server-details">
                        <span>Version: ${srv.server_version && !srv.server_version.startsWith('CMD:') ? srv.server_version : 'Unknown'}</span>
                        <span>RAM: ${srv.ram_mb} MB</span>
                    </div>
                    
                    <div class="controls-grid">
                        <button class="btn-outline" onclick="sendCommand('${srv.id}', 'START')">Start</button>
                        <button class="btn-outline" onclick="sendCommand('${srv.id}', 'STOP')">Stop</button>
                        <button class="btn-outline" onclick="sendCommand('${srv.id}', 'RESTART')">Restart</button>
                        <button class="btn-outline" onclick="sendCommand('${srv.id}', 'HIBERNATE')">Hibernate</button>
                    </div>

                    <div class="console-input">
                        <input type="text" id="cmd-${srv.id}" placeholder="say Hello World">
                        <button onclick="sendConsoleCommand('${srv.id}')">Send</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function sendCommand(serverId, command) {
            await supabaseClient
                .from('koda_servers')
                .update({ server_version: `CMD:${command}` })
                .eq('id', serverId);
        }

        async function sendConsoleCommand(serverId) {
            const input = document.getElementById(`cmd-${serverId}`);
            const text = input.value.trim();
            if (!text) return;
            await sendCommand(serverId, `EXEC_${text}`);
            input.value = '';
        }

        // Start
        checkSession();
    </script>
</body>
</html>
