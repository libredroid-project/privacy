<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Server - KodaHosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --surface: #1a1a1f;
            --surface-hover: #232329;
            --primary: #FF6B00;
            --primary-hover: #ff8533;
            --text: #ffffff;
            --text-secondary: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 12px 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .nav-btn.active {
            background: rgba(255, 107, 0, 0.1);
            color: var(--primary);
        }

        .back-btn {
            margin-top: auto;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-btn:hover { background: var(--surface-hover); }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-online { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .status-offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

        .content-area {
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: none;
        }

        .content-area.active { display: block; }

        /* Cards and Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-family: 'Outfit', sans-serif;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            width: 100%;
        }
        .btn-outline:hover { background: var(--surface-hover); }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(239,68,68,0.1); }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem; }
        .input-group input, .input-group select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); }

        /* File Manager */
        .file-list {
            list-style: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            max-height: 60vh;
            overflow-y: auto;
        }
        .file-item {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: var(--surface-hover); }
        .file-item.folder { font-weight: 600; color: #60a5fa; }
        .file-icon { font-size: 1.2rem; }

        /* Editor */
        #editor-container { display: none; height: 60vh; display: flex; flex-direction: column; }
        #file-editor {
            flex: 1;
            width: 100%;
            background: rgba(0,0,0,0.5);
            color: #d1d5db;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        #file-editor:focus { border-color: var(--primary); }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
            display: none;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor"/>
                <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            KodaHosting
        </div>
        
        <button class="nav-btn active" onclick="switchTab('overview')">📌 Overview</button>
        <button class="nav-btn" onclick="switchTab('properties')">⚙️ Properties</button>
        <button class="nav-btn" onclick="switchTab('files')">📁 File Manager</button>
        
        <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="server-title">Loading...</h1>
            <div id="server-status" class="status-badge status-offline">...</div>
        </div>

        <!-- OVERVIEW TAB -->
        <div id="tab-overview" class="content-area active">
            <div class="grid">
                <div class="card">
                    <h3>Controls</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                        <button class="btn-outline" onclick="sendCommand('START')">▶ Start</button>
                        <button class="btn-outline" onclick="sendCommand('STOP')">⏹ Stop</button>
                        <button class="btn-outline" onclick="sendCommand('RESTART')">🔄 Restart</button>
                        <button class="btn-outline" onclick="sendCommand('HIBERNATE')">⏸ Hibernate</button>
                    </div>
                    
                    <h3>Console Command</h3>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="cmd-input" placeholder="say Hello" style="flex:1; background:rgba(0,0,0,0.3); border:1px solid var(--border); color:#fff; padding:10px; border-radius:8px;">
                        <button class="btn" onclick="sendConsole()">Send</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Hardware Allocation</h3>
                    <div class="input-group">
                        <label>RAM (MB)</label>
                        <input type="number" id="prop-ram">
                    </div>
                    <button class="btn" onclick="saveRam()">Apply RAM</button>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px;">Requires server restart.</p>
                </div>
                
                <div class="card" style="border-color: var(--danger);">
                    <h3 style="color: var(--danger);">Danger Zone</h3>
                    <div style="display: grid; gap: 10px;">
                        <button class="btn-outline btn-danger" onclick="if(confirm('Wipe Server? All files will be deleted!')) sendCommand('WIPE')">Wipe Server Data</button>
                        <button class="btn-outline btn-danger" onclick="if(confirm('Delete Server? This cannot be undone!')) { sendCommand('DELETE'); window.location.href='dashboard.html'; }">Delete Server</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PROPERTIES TAB -->
        <div id="tab-properties" class="content-area">
            <div class="card" style="max-width: 600px;">
                <h3>Server.properties</h3>
                
                <div class="input-group">
                    <label>MOTD</label>
                    <input type="text" id="prop-motd">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label>Gamemode</label>
                        <select id="prop-gamemode">
                            <option value="survival">Survival</option>
                            <option value="creative">Creative</option>
                            <option value="adventure">Adventure</option>
                            <option value="spectator">Spectator</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Difficulty</label>
                        <select id="prop-difficulty">
                            <option value="peaceful">Peaceful</option>
                            <option value="easy">Easy</option>
                            <option value="normal">Normal</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Max Players</label>
                    <input type="number" id="prop-maxplayers">
                </div>
                
                <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="prop-pvp" style="width: 18px; height: 18px; accent-color: var(--primary);">
                        <span>Enable PvP</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="prop-whitelist" style="width: 18px; height: 18px; accent-color: var(--primary);">
                        <span>Enable Whitelist</span>
                    </label>
                </div>
                
                <button class="btn" style="width: 100%;" onclick="saveProperties()">Save Changes</button>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px; text-align: center;">Settings will be applied on next start.</p>
            </div>
        </div>

        <!-- FILE MANAGER TAB -->
        <div id="tab-files" class="content-area">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 id="current-path" style="margin: 0;">/</h3>
                    <button class="btn" id="btn-save-file" style="display: none;" onclick="saveFile()">💾 Save File</button>
                </div>
                
                <div id="file-browser">
                    <ul class="file-list" id="file-list">
                        <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading directory...</div>
                    </ul>
                </div>

                <div id="editor-container" style="display: none;">
                    <textarea id="file-editor" spellcheck="false"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 15px; font-weight: 500;">Requesting from Android Device...</p>
    </div>

    <script>
        const supabaseUrl = 'https://tvuxtmctmmyyfxwubrqi.supabase.co';
        // USE THE KEY FROM DASHBOARD.HTML
        const supabaseKey = 'sbp_0212374e0ed4113c05dab67284296507ae3c1b57';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('id');
        
        let serverData = null;
        let currentPath = "/";
        let activeFileTransferId = null;
        let filePollInterval = null;

        if (!serverId) {
            window.location.href = 'dashboard.html';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');

            if (tabId === 'files' && document.getElementById('file-list').children.length <= 1 && currentPath === "/") {
                requestDirectory("/");
            }
        }

        async function fetchServer() {
            const { data, error } = await supabase.from('koda_servers').select('*').eq('id', serverId).single();
            if (data) {
                serverData = data;
                document.getElementById('server-title').textContent = data.host;
                window.history.replaceState(null, '', '/server/' + data.host); // Update URL visually
                
                const badge = document.getElementById('server-status');
                const ver = data.server_version;
                if (!ver || ver === 'HIBERNATED') { badge.textContent = 'Hibernated'; badge.className = 'status-badge status-offline'; }
                else if (ver.startsWith('CMD:')) { badge.textContent = 'Command Pending...'; badge.className = 'status-badge status-pending'; }
                else if (ver === 'DELETED') { badge.textContent = 'Deleted'; badge.className = 'status-badge status-offline'; }
                else { badge.textContent = 'Active'; badge.className = 'status-badge status-online'; }
                
                // Fill Properties
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                    document.getElementById('prop-ram').value = data.ram_mb || 2048;
                    document.getElementById('prop-motd').value = data.motd || '';
                    document.getElementById('prop-gamemode').value = data.gamemode || 'survival';
                    document.getElementById('prop-difficulty').value = data.difficulty || 'normal';
                    document.getElementById('prop-maxplayers').value = data.max_players || 20;
                    document.getElementById('prop-pvp').checked = data.pvp !== false;
                    document.getElementById('prop-whitelist').checked = data.whitelist === true;
                }
            }
        }

        async function sendCommand(cmd) {
            await supabase.from('koda_servers').update({ server_version: `CMD:${cmd}` }).eq('id', serverId);
            fetchServer();
        }

        async function sendConsole() {
            const val = document.getElementById('cmd-input').value;
            if(val) {
                await sendCommand('EXEC_' + val);
                document.getElementById('cmd-input').value = '';
            }
        }

        async function saveRam() {
            const ram = document.getElementById('prop-ram').value;
            await sendCommand(`SETPROP_ram_${ram}`);
        }

        async function saveProperties() {
            const motd = document.getElementById('prop-motd').value;
            const gm = document.getElementById('prop-gamemode').value;
            const diff = document.getElementById('prop-difficulty').value;
            const maxP = document.getElementById('prop-maxplayers').value;
            const pvp = document.getElementById('prop-pvp').checked;
            const wl = document.getElementById('prop-whitelist').checked;
            
            await sendCommand(`SETPROP_motd_${btoa(motd)}`);
            await new Promise(r => setTimeout(r, 200));
            await sendCommand(`SETPROP_gamemode_${gm}`);
            await new Promise(r => setTimeout(r, 200));
            await sendCommand(`SETPROP_difficulty_${diff}`);
            await new Promise(r => setTimeout(r, 200));
            await sendCommand(`SETPROP_maxPlayers_${maxP}`);
            await new Promise(r => setTimeout(r, 200));
            await sendCommand(`SETPROP_pvp_${pvp}`);
            await new Promise(r => setTimeout(r, 200));
            await sendCommand(`SETPROP_whitelist_${wl}`);
            
            alert("Properties saved! Restart server to apply.");
        }

        // File Manager Logic
        function showLoading(text) {
            document.getElementById('loading-text').textContent = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        async function requestDirectory(path) {
            currentPath = path;
            document.getElementById('current-path').textContent = path;
            document.getElementById('file-browser').style.display = 'block';
            document.getElementById('editor-container').style.display = 'none';
            document.getElementById('btn-save-file').style.display = 'none';
            
            showLoading("Requesting directory list...");
            
            const { data } = await supabase.from('koda_file_transfers').insert([{
                server_id: serverId,
                file_path: path,
                status: 'REQUEST_DIR'
            }]).select();
            
            activeFileTransferId = data[0].id;
            startPolling('UPLOADED_DIR', handleDirectoryLoaded);
        }

        async function requestFile(path) {
            currentPath = path;
            document.getElementById('current-path').textContent = path;
            
            showLoading("Requesting file from Android...");
            
            const { data } = await supabase.from('koda_file_transfers').insert([{
                server_id: serverId,
                file_path: path,
                status: 'REQUEST_FILE'
            }]).select();
            
            activeFileTransferId = data[0].id;
            startPolling('UPLOADED_FILE', handleFileLoaded);
        }

        function startPolling(targetStatus, callback) {
            if (filePollInterval) clearInterval(filePollInterval);
            let attempts = 0;
            filePollInterval = setInterval(async () => {
                attempts++;
                if (attempts > 30) { // 30 seconds timeout
                    clearInterval(filePollInterval);
                    hideLoading();
                    alert("Android device is not responding. Is the app open?");
                    // Cleanup
                    await supabase.from('koda_file_transfers').delete().eq('id', activeFileTransferId);
                    return;
                }
                
                const { data } = await supabase.from('koda_file_transfers').select('*').eq('id', activeFileTransferId).single();
                if (data && data.status === targetStatus) {
                    clearInterval(filePollInterval);
                    hideLoading();
                    callback(data.content_b64);
                    // Delete row after reading
                    await supabase.from('koda_file_transfers').delete().eq('id', activeFileTransferId);
                }
            }, 1000);
        }

        function handleDirectoryLoaded(base64Json) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            try {
                const jsonStr = atob(base64Json);
                const items = JSON.parse(jsonStr);
                
                // Add UP button if not root
                if (currentPath !== "/") {
                    const parentParts = currentPath.split('/').filter(p => p.length > 0);
                    parentParts.pop();
                    const parentPath = parentParts.length === 0 ? "/" : "/" + parentParts.join('/') + "/";
                    
                    list.innerHTML += `
                        <li class="file-item folder" onclick="requestDirectory('${parentPath}')">
                            <span class="file-icon">📁</span> .. (Go Up)
                        </li>
                    `;
                }

                // Sort: Folders first, then files alphabetically
                items.sort((a, b) => {
                    if (a.is_dir === b.is_dir) return a.name.localeCompare(b.name);
                    return a.is_dir ? -1 : 1;
                });

                items.forEach(item => {
                    const fullPath = currentPath === "/" ? "/" + item.name : currentPath + (currentPath.endsWith('/') ? '' : '/') + item.name;
                    if (item.is_dir) {
                        list.innerHTML += `
                            <li class="file-item folder" onclick="requestDirectory('${fullPath}/')">
                                <span class="file-icon">📁</span> ${item.name}
                            </li>
                        `;
                    } else {
                        list.innerHTML += `
                            <li class="file-item" onclick="requestFile('${fullPath}')">
                                <span class="file-icon">📄</span> ${item.name}
                            </li>
                        `;
                    }
                });
                
                if (items.length === 0) {
                    list.innerHTML += `<li style="padding: 20px; text-align: center; color: var(--text-secondary);">Folder is empty.</li>`;
                }
            } catch (e) {
                list.innerHTML = `<li style="padding: 20px; color: var(--danger);">Failed to parse directory data.</li>`;
            }
        }

        function handleFileLoaded(base64Content) {
            document.getElementById('file-browser').style.display = 'none';
            document.getElementById('editor-container').style.display = 'flex';
            document.getElementById('btn-save-file').style.display = 'block';
            
            try {
                // Handle UTF-8 safely
                const text = decodeURIComponent(escape(atob(base64Content)));
                document.getElementById('file-editor').value = text;
            } catch(e) {
                document.getElementById('file-editor').value = atob(base64Content);
            }
        }

        async function saveFile() {
            showLoading("Saving to Android device...");
            const text = document.getElementById('file-editor').value;
            // Handle UTF-8 safely
            const b64 = btoa(unescape(encodeURIComponent(text)));
            
            const { data } = await supabase.from('koda_file_transfers').insert([{
                server_id: serverId,
                file_path: currentPath,
                content_b64: b64,
                status: 'SAVING_FILE'
            }]).select();
            
            activeFileTransferId = data[0].id;
            
            // Poll for deletion (which means Android saved it)
            if (filePollInterval) clearInterval(filePollInterval);
            let attempts = 0;
            filePollInterval = setInterval(async () => {
                attempts++;
                if (attempts > 30) {
                    clearInterval(filePollInterval);
                    hideLoading();
                    alert("Android device took too long to save.");
                    return;
                }
                
                const { data, error } = await supabase.from('koda_file_transfers').select('*').eq('id', activeFileTransferId);
                if (!data || data.length === 0) {
                    // Row deleted! Saved successfully.
                    clearInterval(filePollInterval);
                    hideLoading();
                    
                    // Go back to directory list
                    const parentParts = currentPath.split('/').filter(p => p.length > 0);
                    parentParts.pop();
                    const parentPath = parentParts.length === 0 ? "/" : "/" + parentParts.join('/') + "/";
                    requestDirectory(parentPath);
                    alert("File saved successfully!");
                }
            }, 1000);
        }

        // Init
        fetchServer();
        setInterval(fetchServer, 5000);
    </script>
</body>
</html>
