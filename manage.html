<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Detail - KodaHosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0A0807;
            --tab-bg: #0E0E14;
            --card-bg: #241C18;
            --accent: #FF6B00;
            --text-main: #FFFFFF;
            --text-sec: #8A8A9A;
            --border: #2E241E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Bar */
        .top-bar { height: 56px; display: flex; align-items: center; padding: 0 16px; background: var(--bg); z-index: 10; flex-shrink: 0; }
        .btn-back { background: transparent; border: none; color: var(--accent); font-size: 20px; font-weight: bold; cursor: pointer; padding: 8px 12px 8px 0; }
        .server-title { flex: 1; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #F0F0F0; letter-spacing: 0.02em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; margin: 0 8px; }
        .status-dot.online { background: #44FF44; }
        .status-dot.pending { background: #FFCC00; }
        .status-text { font-size: 11px; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; }
        .header-divider { height: 2px; background: var(--accent); opacity: 0.6; }

        /* Tabs */
        .tabs-container { background: var(--tab-bg); height: 44px; display: flex; flex-shrink: 0; }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-sec); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-divider { height: 1px; background: #1A1A24; flex-shrink: 0; }

        /* Content Area */
        .content-area { flex: 1; overflow-y: auto; display: none; padding: 16px; }
        .content-area.active { display: block; }

        /* Cards */
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .card-header { color: var(--accent); font-size: 11px; font-weight: bold; letter-spacing: 0.1em; margin-bottom: 14px; text-transform: uppercase; }
        .info-row { display: flex; margin-bottom: 14px; }
        .info-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .info-label { color: #888899; font-size: 9px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
        .info-val { color: #FFFFFF; font-size: 14px; }
        .info-divider { height: 1px; background: var(--border); margin: 14px 0; }

        /* Buttons */
        .btn-row { display: flex; gap: 16px; margin-bottom: 16px; justify-content: center; }
        .btn { flex: 1; height: 48px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: 0.2s; border: none; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); }
        .btn:active { transform: scale(0.98); }
        .btn-restart { width: 140px; margin: 0 auto; display: block; border-color: rgba(255,255,255,0.2); background: transparent; color: var(--text-main); }

        /* Join Address */
        .join-addr { color: #FFFFFF; font-size: 18px; font-weight: bold; padding: 4px 0; user-select: text; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; color: var(--text-sec); font-size: 12px; margin-bottom: 6px; font-weight: 500; }
        .form-input { width: 100%; background: #1B1512; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        .form-input:focus { border-color: var(--accent); }
        .form-check { display: flex; align-items: center; gap: 10px; margin-top: 8px; margin-bottom: 16px;}
        .form-check input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
        .form-check label { color: #fff; font-size: 14px; cursor: pointer; }

        /* Files */
        .files-path-bg { background: #1B1512; padding: 8px 16px; display: flex; align-items: center; gap: 8px; height: 36px; border-bottom: 1px solid #1A1A24;}
        .files-path-prefix { color: var(--accent); font-size: 12px; font-weight: 500; }
        .files-path { flex: 1; color: #8A8A9A; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .file-item:hover { background: rgba(255,255,255,0.05); }
        .file-item.folder { color: #60a5fa; font-weight: 500; }
        .file-icon { font-size: 18px; }

        /* Editor */
        .editor-container { display: none; height: 100%; flex-direction: column; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        .editor-textarea { flex: 1; background: #0A0A0F; color: #d1d5db; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; resize: none; outline: none; white-space: pre; overflow: auto; }
        
        /* Fullscreen Loading Overlay */
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0A0A0F; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 24px; color: #F0F0F0; font-weight: bold; letter-spacing: 0.08em; font-size: 13px; text-transform: uppercase; }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="btn-back" onclick="window.location.href='dashboard.html'">❮</button>
        <div class="server-title" id="server-title"></div>
        <div class="status-dot" id="status-dot" style="display:none;"></div>
        <div class="status-text" id="status-text"></div>
    </div>
    <div class="header-divider"></div>

    <!-- Tabs -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('dash', this)">Dashboard</button>
        <button class="tab-btn" onclick="switchTab('files', this)">Files</button>
        <button class="tab-btn" onclick="switchTab('settings', this)">Settings</button>
    </div>
    <div class="tab-divider"></div>

    <!-- Tab 1: DASHBOARD -->
    <div class="content-area active" id="tab-dash">
        <div class="card">
            <div class="card-header">Status & Info</div>
            <div class="info-row">
                <div class="info-col">
                    <span class="info-label">UPTIME</span>
                    <span class="info-val" id="info-uptime">--:--:--</span>
                </div>
                <div class="info-col">
                    <span class="info-label">ONLINE</span>
                    <span class="info-val" id="info-players">0 / 20 Spieler</span>
                </div>
            </div>
            <div class="info-divider"></div>
            <div class="info-row" style="margin-bottom: 0;">
                <div class="info-col" style="flex: 2;">
                    <span class="info-val" id="info-version" style="font-size: 13px; color: #AAAAAA;">Minecraft 1.21.11</span>
                </div>
                <div class="info-col">
                    <span class="info-val" id="info-ram" style="font-size: 13px; color: #AAAAAA;">2048 MB RAM</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Connection</div>
            <span class="info-label">JOIN ADDRESS (JAVA)</span>
            <div class="join-addr" id="info-join">loading.kodanetwork.eu</div>
        </div>

        <div class="card">
            <div class="card-header">Controls</div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="sendCommand('START')">Start</button>
                <button class="btn btn-outline" onclick="sendCommand('STOP')">Stop</button>
            </div>
            <button class="btn btn-outline btn-restart" onclick="sendCommand('RESTART')">Restart</button>
        </div>
    </div>

    <!-- Tab 2: FILES -->
    <div class="content-area" id="tab-files" style="padding: 0;">
        <div id="file-browser">
            <div class="files-path-bg">
                <span class="files-path-prefix">~/servers/</span>
                <span class="files-path" id="current-path-text">/</span>
            </div>
            <div id="file-list" style="background:#0E0E14; min-height: 100%;"></div>
        </div>

        <div class="editor-container" id="editor-container" style="padding: 16px;">
            <div class="editor-header">
                <h3 id="editing-filename" style="color:var(--accent); font-size:14px;">editing...</h3>
                <div style="display: flex; gap:8px;">
                    <button class="btn btn-outline" style="height:32px; font-size:11px; padding:0 12px; margin-right:8px;" onclick="closeEditor()">Cancel</button>
                    <button class="btn btn-primary" style="height:32px; font-size:11px; padding:0 12px;" onclick="saveFile()">Save</button>
                </div>
            </div>
            <textarea class="editor-textarea" id="file-editor" spellcheck="false"></textarea>
        </div>
    </div>

    <!-- Tab 3: SETTINGS -->
    <div class="content-area" id="tab-settings">
        <div class="card">
            <div class="card-header">Server Properties</div>
            <div class="form-group">
                <label class="form-label">MOTD (Message of the Day)</label>
                <input type="text" class="form-input" id="prop-motd" onchange="updateProp('motd', this.value)">
            </div>
            <div class="form-group">
                <label class="form-label">RAM (MB)</label>
                <input type="range" min="1024" max="8192" step="512" class="form-input" id="prop-ram-slider" oninput="document.getElementById('prop-ram-val').textContent = this.value + ' MB'" onchange="updateProp('ram', this.value)">
                <div style="text-align:right; color:var(--accent); font-size:12px; font-weight:bold; margin-top:4px;" id="prop-ram-val">2048 MB</div>
            </div>
            <div class="form-group">
                <label class="form-label">Gamemode</label>
                <select class="form-input" id="prop-gamemode" onchange="updateProp('gamemode', this.value)">
                    <option value="survival">Survival</option>
                    <option value="creative">Creative</option>
                    <option value="adventure">Adventure</option>
                    <option value="spectator">Spectator</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Difficulty</label>
                <select class="form-input" id="prop-difficulty" onchange="updateProp('difficulty', this.value)">
                    <option value="peaceful">Peaceful</option>
                    <option value="easy">Easy</option>
                    <option value="normal">Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Max Players</label>
                <input type="number" class="form-input" id="prop-maxplayers" onchange="updateProp('maxPlayers', this.value)">
            </div>
            <div class="form-check">
                <input type="checkbox" id="prop-pvp" onchange="updateProp('pvp', this.checked)">
                <label for="prop-pvp">Enable PvP</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="prop-whitelist" onchange="updateProp('whitelist', this.checked)">
                <label for="prop-whitelist">Enable Whitelist</label>
            </div>
            <div style="margin-top:24px;">
                <button class="btn btn-outline" style="width:100%; border-color:#FF3344; color:#FF3344;" onclick="sendCommand('WIPE')">Wipe Server (Delete all data)</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text" id="loading-text">Requesting from Android Device...</p>
    </div>

    <script>
        const supabaseUrl = 'https://scsezpfrrmpyuapblbxk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjc2V6cGZycm1weXVhcGJsYnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDE4MjYsImV4cCI6MjA5MjUxNzgyNn0.rHro6kQpXHAnxEaFxozYzsKY8IHIUlot-7-Q4LNbZT8';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('id');
        
        let serverData = null;
        let currentPath = "/";
        let activeFileTransferId = null;
        let filePollInterval = null;

        if (!serverId) {
            window.location.href = 'dashboard.html';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');

            if (tabId === 'files' && document.getElementById('file-list').children.length === 0 && currentPath === "/") {
                requestDirectory("/");
            }
        }

        async function fetchServer() {
            const { data, error } = await supabase.from('koda_servers').select('*').eq('id', serverId).single();
            if (data) {
                serverData = data;
                document.getElementById('server-title').textContent = data.host;
                window.history.replaceState(null, '', '/server/' + data.host); // Update URL visually
                
                const dot = document.getElementById('status-dot');
                const badge = document.getElementById('status-text');
                const ver = data.server_version;
                
                dot.style.display = 'block';
                if (!ver || ver === 'HIBERNATED') { 
                    badge.textContent = 'HIBERNATED'; 
                    dot.className = 'status-dot';
                    dot.style.background = '#FF6B00';
                } else if (ver.startsWith('CMD:')) { 
                    badge.textContent = 'PENDING...'; 
                    dot.className = 'status-dot pending'; 
                } else if (ver === 'DELETED') { 
                    badge.textContent = 'DELETED'; 
                    dot.className = 'status-dot'; 
                } else { 
                    badge.textContent = 'ONLINE'; 
                    dot.className = 'status-dot online'; 
                }
                
                document.getElementById('info-version').textContent = "Minecraft " + (ver || "1.21.11");
                document.getElementById('info-ram').textContent = (data.ram_mb || 2048) + " MB RAM";
                document.getElementById('info-join').textContent = data.host;
                
                // Fill Properties
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                    document.getElementById('prop-ram-slider').value = data.ram_mb || 2048;
                    document.getElementById('prop-ram-val').textContent = (data.ram_mb || 2048) + " MB";
                    document.getElementById('prop-motd').value = data.motd || '';
                    document.getElementById('prop-gamemode').value = data.gamemode || 'survival';
                    document.getElementById('prop-difficulty').value = data.difficulty || 'normal';
                    document.getElementById('prop-maxplayers').value = data.max_players || 20;
                    document.getElementById('prop-pvp').checked = data.pvp !== false;
                    document.getElementById('prop-whitelist').checked = data.whitelist === true;
                }
            }
        }

        async function updateProp(key, val) {
            if (!serverData) return;
            if (key === 'motd') val = btoa(val);
            const cmd = `CMD:SETPROP_${key}_${val}`;
            
            const dot = document.getElementById('status-dot');
            const badge = document.getElementById('status-text');
            badge.textContent = 'SAVING...'; 
            dot.className = 'status-dot pending'; 
            
            const { error } = await supabase.from('koda_servers').update({ server_version: cmd }).eq('id', serverId);
            if (error) alert("Error saving: " + error.message);
        }

        async function sendCommand(cmdStr) {
            const dot = document.getElementById('status-dot');
            const badge = document.getElementById('status-text');
            badge.textContent = 'PENDING...'; 
            dot.className = 'status-dot pending'; 
            
            const { error } = await supabase.from('koda_servers').update({ server_version: `CMD:${cmdStr}` }).eq('id', serverId);
            if (error) alert("Error sending command: " + error.message);
        }

        // ================= FILES LOGIC =================

        function showLoading(msg) {
            document.getElementById('loading-text').textContent = msg;
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        async function createTransferRow(path, status) {
            const { data, error } = await supabase.from('koda_file_transfers')
                .insert([{ server_id: serverId, file_path: path, status: status }])
                .select();
            if (error) {
                alert("Database Error: " + error.message + "\nDid you run the supabase_update.sql script?");
                return null;
            }
            if (data && data.length > 0) return data[0].id;
            return null;
        }

        function pollFileTransfer(targetStatus, callback) {
            if (filePollInterval) clearInterval(filePollInterval);
            
            filePollInterval = setInterval(async () => {
                if (!activeFileTransferId) {
                    clearInterval(filePollInterval);
                    hideLoading();
                    return;
                }
                
                const { data } = await supabase.from('koda_file_transfers').select('*').eq('id', activeFileTransferId).single();
                if (data && data.status === targetStatus) {
                    clearInterval(filePollInterval);
                    hideLoading();
                    callback(data.content_b64);
                    await supabase.from('koda_file_transfers').delete().eq('id', activeFileTransferId);
                }
            }, 1000);
        }

        function handleDirectoryLoaded(base64Json) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            try {
                const jsonStr = decodeURIComponent(escape(atob(base64Json)));
                const items = JSON.parse(jsonStr);
                
                if (currentPath !== "/") {
                    const parentParts = currentPath.split('/').filter(p => p.length > 0);
                    parentParts.pop();
                    const parentPath = parentParts.length === 0 ? "/" : "/" + parentParts.join('/') + "/";
                    
                    list.innerHTML += `
                        <div class="file-item folder" onclick="requestDirectory('${parentPath}')">
                            <span class="file-icon">📁</span> .. (Go Up)
                        </div>
                    `;
                }

                items.sort((a, b) => {
                    if (a.is_dir === b.is_dir) return a.name.localeCompare(b.name);
                    return a.is_dir ? -1 : 1;
                });

                items.forEach(item => {
                    const fullPath = currentPath === "/" ? "/" + item.name : currentPath + (currentPath.endsWith('/') ? '' : '/') + item.name;
                    if (item.is_dir) {
                        list.innerHTML += `
                            <div class="file-item folder" onclick="requestDirectory('${fullPath}/')">
                                <span class="file-icon">📁</span> ${item.name}
                            </div>
                        `;
                    } else {
                        list.innerHTML += `
                            <div class="file-item" onclick="requestFile('${fullPath}')">
                                <span class="file-icon">📄</span> ${item.name}
                            </div>
                        `;
                    }
                });
            } catch(e) {
                console.error("Failed to parse dir JSON", e);
                list.innerHTML = '<p style="padding:16px; color:red;">Failed to load directory</p>';
            }
        }

        async function requestDirectory(path) {
            showLoading(`Loading directory ${path}...`);
            currentPath = path;
            document.getElementById('current-path-text').textContent = path;
            
            const reqPath = path === "/" ? "." : path.substring(1);
            activeFileTransferId = await createTransferRow(reqPath, "REQUEST_DIR");
            
            if (activeFileTransferId) {
                pollFileTransfer("UPLOADED_DIR", handleDirectoryLoaded);
            } else {
                hideLoading();
            }
        }

        async function requestFile(path) {
            showLoading(`Loading file ${path}...`);
            const reqPath = path.substring(1);
            
            document.getElementById('editing-filename').textContent = path;
            activeFileTransferId = await createTransferRow(reqPath, "REQUEST_FILE");
            
            if (activeFileTransferId) {
                pollFileTransfer("UPLOADED_FILE", (b64) => {
                    const content = b64 ? decodeURIComponent(escape(atob(b64))) : "";
                    document.getElementById('file-editor').value = content;
                    document.getElementById('file-browser').style.display = 'none';
                    document.getElementById('editor-container').style.display = 'flex';
                });
            } else {
                hideLoading();
            }
        }

        function closeEditor() {
            document.getElementById('file-browser').style.display = 'block';
            document.getElementById('editor-container').style.display = 'none';
        }

        async function saveFile() {
            const content = document.getElementById('file-editor').value;
            const b64 = btoa(unescape(encodeURIComponent(content)));
            const path = document.getElementById('editing-filename').textContent.substring(1);
            
            showLoading(`Saving file...`);
            
            const { data } = await supabase.from('koda_file_transfers')
                .insert([{ server_id: serverId, file_path: path, status: "SAVING_FILE", content_b64: b64 }]);
            
            setTimeout(() => {
                hideLoading();
                closeEditor();
            }, 2000);
        }

        // Init
        fetchServer();
        setInterval(fetchServer, 3000);
    </script>
</body>
</html>
