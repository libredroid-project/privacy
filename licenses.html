<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licenses | KodaHosting</title>
    <meta name="description" content="Licenses for the KodaHosting mobile application and Web Dashboard.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0E0E11;
            color: #E5E5E7;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        a { color: #FF6B00; text-decoration: underline; text-underline-offset: 2px; }
        a:hover { color: #FF8533; }

        .header {
            border-bottom: 1px solid #1F1F24;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #E5E5E7;
            text-decoration: none;
        }
        .logo img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
        }
        .logo span { color: #FF6B00; }
        .back {
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }
        .back:hover { color: #E5E5E7; }

        .content {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 32px 96px;
        }
        .updated {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 32px;
            color: #fff;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 36px;
            margin-bottom: 12px;
            color: #fff;
        }
        p {
            margin-bottom: 14px;
            color: #B5B5B8;
            font-size: 0.95rem;
        }
        strong { color: #E5E5E7; font-weight: 600; }
        ul {
            margin: 12px 0 16px;
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
            color: #B5B5B8;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .header { padding: 16px 20px; }
            .content { padding: 40px 20px 64px; }
            h1 { font-size: 1.6rem; }
        }
        /* koda-legal-start */
        .lang-switch {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            margin-bottom: 28px;
            background: #17171B;
            border: 1px solid #1F1F24;
            border-radius: 999px;
        }
        .lang-switch button {
            font: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            color: #B5B5B8;
            background: transparent;
            border: 0;
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
        }
        .lang-switch button.active { background: #FF6B00; color: #fff; }
        .doc { display: none; }
        .doc.active { display: block; }
        .danger-rule {
            border-left: 3px solid #FF6B00;
            background: #1A1210;
            border-radius: 8px;
            padding: 16px 20px 4px;
            margin: 20px 0;
        }
        .danger-title { margin-top: 0; color: #FF6B00; }
        /* koda-legal-end */
        .license-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .license-item {
            background: #17171B; border: 1px solid #1F1F24; border-radius: 10px; overflow: hidden;
        }
        .license-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 18px; cursor: pointer; font-size: 0.95rem; color: #E5E5E7; font-weight: 500;
        }
        .license-head:hover { background: #1D1D22; }
        .license-head .chev { color: #FF6B00; font-size: 1.1rem; transition: transform 0.2s; }
        .license-item.open .license-head .chev { transform: rotate(180deg); }
        .license-body { display: none; padding: 0 18px 16px; }
        .license-item.open .license-body { display: block; }
        .license-body pre {
            white-space: pre-wrap; word-break: break-word; margin: 0;
            font-family: ui-monospace, 'JetBrains Mono', monospace;
            font-size: 0.72rem; line-height: 1.55; color: #B5B5B8;
            max-height: 340px; overflow-y: auto;
        }
        .license-body a { color: #FF6B00; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="assets/logo.jpg" alt="KodaHosting">
            Koda<span>Hosting</span>
        </a>
        <a href="index.html" class="back">Back</a>
    </header>

            <main class="content">
        <h1>Licenses</h1>
        <p class="updated">Third-party components, fonts and runtimes shipped with the KodaHosting app and the KodaDash plugin.</p>

        <div class="license-list" id="license-list">
            <p>Loading...</p>
        </div>
    </main>

    <script>
        // The list is generated from the app's own licence folder (licenses/manifest.json).
        (function () {
            var list = document.getElementById('license-list');
            fetch('licenses/manifest.json')
                .then(function (r) { if (!r.ok) throw new Error('manifest'); return r.json(); })
                .then(function (entries) {
                    list.innerHTML = entries.map(function (entry) {
                        return '<div class="license-item" data-file="' + entry.file + '" data-type="' + entry.type + '">'
                            + '<div class="license-head">' + entry.title + '<span class="chev">&#9662;</span></div>'
                            + '<div class="license-body"></div></div>';
                    }).join('');

                    list.querySelectorAll('.license-item').forEach(function (item) {
                        var body = item.querySelector('.license-body');
                        var file = item.getAttribute('data-file');
                        var isPdf = item.getAttribute('data-type') === 'pdf';
                        item.querySelector('.license-head').addEventListener('click', function () {
                            var opening = !item.classList.contains('open');
                            item.classList.toggle('open');
                            if (!opening || body.dataset.loaded) return;
                            body.dataset.loaded = '1';
                            if (isPdf) {
                                body.innerHTML = '<pre><a href="licenses/' + file + '" target="_blank" rel="noopener">Open PDF</a></pre>';
                                return;
                            }
                            fetch('licenses/' + file)
                                .then(function (r) { return r.text(); })
                                .then(function (text) {
                                    body.innerHTML = '<pre></pre>';
                                    body.querySelector('pre').textContent = text.slice(0, 60000);
                                })
                                .catch(function () { body.innerHTML = '<pre>Could not be loaded.</pre>'; });
                        });
                    });
                })
                .catch(function () { list.innerHTML = '<p>License list could not be loaded.</p>'; });
        })();
    </script>
</body>
</html>
